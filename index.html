<body>
  <a class="skip-link" href="#app">본문으로 건너뛰기</a>
  <header id="topbar" class="topbar" hidden>
    <div class="brand" data-go="meeting" title="회의실로">🧠 BrainRoom <span id="teamName"></span></div>
    <nav id="nav">
      <button data-go="meeting">🗂️ 회의실</button>
      <button data-go="room">🚪 내 방</button>
      <button data-go="office">🏢 전체 보기</button>
      <button data-go="timeline">🕒 타임라인</button>
      <button data-go="decisions">✅ 결정</button>
      <button data-go="report">📊 리포트</button>
      <button data-go="calls">🎙️ 회의</button>
      <button data-go="integrations">🔌 연동</button>
    </nav>
    <div id="profBadge" class="prof-badge" hidden>🎓 교수자 보기 <button class="btn sm" data-tr="leave-prof">학생 보기로</button></div>
    <div class="me">
      <label id="meSwitch">나 <select id="meSelect" title="현재 사용자 (데모용 전환)"></select></label>
      <button id="roomsBtn" class="btn sm" hidden title="방 만들기 · 참여하기 · 다른 방으로 이동">🏠 방 목록</button>
      <button id="inviteBtn" class="btn sm" hidden title="이 방의 초대 링크 보기">🔗 초대 링크</button>
      <div id="userChip" class="user-chip" hidden></div>
      <button id="menuBtn" class="btn icon" title="워크스페이스 설정">⚙️</button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>
  <aside id="panel" class="panel"></aside>
  <div id="modal" class="modal" hidden></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <footer class="legal-footer">
    <a href="legal/privacy.html"><b>개인정보처리방침</b></a>
    <a href="legal/terms.html">이용약관</a>
    <a href="legal/cookies.html">쿠키·브라우저 저장</a>
    <a href="legal/licenses.html">오픈소스·글꼴</a>
    <span id="legalOperator"></span>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/13.2.0/firebase-app-compat.js" integrity="sha384-cLbh0Cu4dx/85kRPmEgNAXMBIChYFkojdl+72mu8+CktIaQ1u3yBrkyiKnDRkZ2q" crossorigin="anonymous"></script>

  <script src="https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore-compat.js" integrity="sha384-GHWlC9m/51vE+OUgd7/bifFHoPpmxesvM2MyoM0DP8zOuSG6h+e6QsbkCSlvkIWs" crossorigin="anonymous"></script>
  <script src="js/firebase-config.js?v=20261105g"></script>

  <script src="js/store.js?v=20261105g"></script>
  <script src="js/trace.js?v=20261105g"></script>
  <script src="js/cloud.js?v=20261105g"></script>
  <script src="js/iso.js?v=20261105g"></script>
  <script src="js/decor.js?v=20261105g"></script>
  <script src="js/room.js?v=20261105g"></script>
  <script src="js/hall.js?v=20261105g"></script>
  <script src="js/player.js?v=20261105g"></script>
  <script src="js/views.js?v=20261105g"></script>
  <script src="js/meeting.js?v=20261105g"></script>
  <script src="js/meetimport.js?v=20261105g"></script>
  <script src="js/secure.js?v=20261105g"></script>
  <script src="js/ai.js?v=20261105g"></script>

</body>
